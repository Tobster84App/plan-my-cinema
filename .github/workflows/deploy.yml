# Baut die Seite, führt die Tests aus und lädt dist/ per FTPS zu ALL-INKL hoch.
# Benötigte Repository-Secrets: FTP_HOST, FTP_USER, FTP_PASSWORD
# FTP_USER sollte ein FTP-Zusatzkonto sein, das nur auf das Verzeichnis der Website zugreifen darf
# (mirror --delete löscht im Zielverzeichnis alles, was nicht in dist/ liegt).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Upload zu ALL-INKL (FTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            mirror --reverse --delete --verbose --exclude-glob .well-known/ dist/ ./;
            quit"
