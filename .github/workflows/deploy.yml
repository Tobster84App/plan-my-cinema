# Baut die Seite, führt die Tests aus und lädt dist/ per FTPS zu ALL-INKL hoch.
# Benötigte Repository-Secrets: FTP_HOST, FTP_USER, FTP_PASSWORD, RCLONE_DRIVE_TOKEN
# Vor jedem Upload werden Serverstand und neue Version als ZIP im Google Drive gesichert
# (Ordner „Plan My Cinema/Sicherungen“). Schlägt die Sicherung fehl, wird nicht hochgeladen.
# FTP_USER sollte ein FTP-Zusatzkonto sein, das nur auf das Verzeichnis der Website zugreifen darf
# (mirror --delete löscht im Zielverzeichnis alles, was nicht in dist/ liegt).
name: Deploy

# Vorerst nur manuell, bis Zielverzeichnis und FTP-Konto geprüft sind.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
      # Google-Drive-Ordner „Plan My Cinema/Sicherungen“
      DRIVE_FOLDER_ID: 1BTRH3_4xhyCpzHhpLI74nupi6NjvbKEq
      RCLONE_VERSION: v1.75.2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Werkzeuge installieren (lftp, rclone)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp unzip
          cd /tmp
          curl -fsSLO "https://downloads.rclone.org/${RCLONE_VERSION}/rclone-${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSL "https://downloads.rclone.org/${RCLONE_VERSION}/SHA256SUMS" | grep " rclone-${RCLONE_VERSION}-linux-amd64.zip$" | sha256sum -c -
          unzip -q "rclone-${RCLONE_VERSION}-linux-amd64.zip"
          sudo install -m 755 "rclone-${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1

      - name: Sicherung ins Google Drive (Serverstand + neue Version)
        run: |
          if [ -z "$RCLONE_DRIVE_TOKEN" ]; then echo "::error::Secret RCLONE_DRIVE_TOKEN fehlt – ohne Sicherung kein Upload."; exit 1; fi
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then echo "::error::FTP-Secrets fehlen."; exit 1; fi
          STAMP="$(TZ=Europe/Berlin date +%Y-%m-%d_%H%M%S)_${GITHUB_SHA::7}"
          LFTP_SET="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;"
          # 1. aktuellen Serverstand herunterladen
          mkdir -p /tmp/server
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SET mirror --verbose=0 ./ /tmp/server/; quit"
          (cd /tmp/server && zip -qr -y "/tmp/server_${STAMP}.zip" .)
          # 2. neue Version packen
          (cd dist && zip -qr "/tmp/neu_${STAMP}.zip" .)
          ls -la /tmp/*_"${STAMP}".zip
          # 3. ins Drive hochladen (Konfiguration nur im Arbeitsspeicher, Token aus Secret)
          export RCLONE_CONFIG_GDRIVE_TYPE=drive
          export RCLONE_CONFIG_GDRIVE_SCOPE=drive
          export RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID="$DRIVE_FOLDER_ID"
          export RCLONE_CONFIG_GDRIVE_TOKEN="$RCLONE_DRIVE_TOKEN"
          rclone copy "/tmp/server_${STAMP}.zip" gdrive: --retries 3
          rclone copy "/tmp/neu_${STAMP}.zip" gdrive: --retries 3
          rclone lsl gdrive: --include "*_${STAMP}.zip"

      - name: Upload zu ALL-INKL (FTPS)
        run: |
          LFTP_SET="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;"
          # Sicherung: Nur hochladen, wenn im Zielverzeichnis die Markierungsdatei liegt.
          # Sie wurde einmalig von Hand angelegt und belegt, dass das FTP-Konto auf das
          # Website-Verzeichnis beschränkt ist. Ohne sie bricht der Upload ab.
          if ! lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SET cls -1 .plan-my-cinema-deploy; quit" | grep -qx '.plan-my-cinema-deploy'; then
            echo "::error::Markierungsdatei .plan-my-cinema-deploy fehlt im Zielverzeichnis – Upload abgebrochen."
            exit 1
          fi
          # Ohne --delete: alte Dateien bleiben liegen, es wird nie etwas gelöscht.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SET mirror --reverse --verbose dist/ ./; quit"
